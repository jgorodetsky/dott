name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/check.sh
      - name: contract test against jgorodetsky/dotfiles
        run: |
          git clone --quiet --depth 1 https://github.com/jgorodetsky/dotfiles "$RUNNER_TEMP/dotfiles"
          if [ -f "$RUNNER_TEMP/dotfiles/dott.toml" ]; then
            DOTT_CONTRACT_REPO="$RUNNER_TEMP/dotfiles" go test -count=1 -run TestContract -v ./cmd/dott
          else
            echo "::notice::jgorodetsky/dotfiles has no dott.toml yet"
          fi
